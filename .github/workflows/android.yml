name: Build Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '*.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP=""
          for candidate in simulator-main.zip source.zip; do
            if [ -f "$candidate" ]; then SOURCE_ZIP="$candidate"; break; fi
          done
          if [ -z "$SOURCE_ZIP" ]; then
            SOURCE_ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'PC-Simulator-Android.zip' -print | sort | head -n 1 || true)
          fi
          if [ -z "$SOURCE_ZIP" ]; then echo 'ERROR: No source ZIP found.'; exit 1; fi
          echo "Using source archive: $SOURCE_ZIP"
          mkdir -p "$RUNNER_TEMP/source-unpacked"
          unzip -q "$SOURCE_ZIP" -d "$RUNNER_TEMP/source-unpacked"
          PACKAGE_FILE=$(find "$RUNNER_TEMP/source-unpacked" -type f -name package.json -not -path '*/node_modules/*' -print | while read -r f; do d=$(dirname "$f"); if [ -f "$d/angular.json" ]; then echo "$f"; break; fi; done)
          if [ -z "$PACKAGE_FILE" ]; then echo 'ERROR: ZIP must contain package.json and angular.json.'; exit 1; fi
          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project extracted to: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install --no-audit --no-fund

      - name: Add Capacitor Android dependency
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/android@7.4.4 --save-exact --no-audit --no-fund

      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build -- --configuration production

      - name: Create Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Package APK into ZIP
        shell: bash
        run: |
          set -euo pipefail
          APK="${PROJECT_DIR}/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          mkdir -p release
          cp "$APK" release/PC-Simulator-debug.apk
          (cd release && zip -q ../PC-Simulator-Android.zip PC-Simulator-debug.apk)

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: PC-Simulator-Android
          path: |
            release/PC-Simulator-debug.apk
            PC-Simulator-Android.zip
          if-no-files-found: error
          retention-days: 30
          
