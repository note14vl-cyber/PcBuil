
name: Build PC Workshop 3D APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Export Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.4.1

    env:
      ANDROID_HOME: /usr/lib/android-sdk
      ANDROID_SDK_ROOT: /usr/lib/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot Android export templates
        shell: bash
        run: |
          set -euo pipefail

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          TMP_DIR="$(mktemp -d)"

          mkdir -p "$TEMPLATE_DIR"

          echo "Downloading Godot 4.4.1 export templates..."

          wget -q --show-progress --tries=3 \
            "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" \
            -O "$TMP_DIR/export_templates.tpz"

          unzip -q "$TMP_DIR/export_templates.tpz" -d "$TMP_DIR/unpacked"

          if [ -d "$TMP_DIR/unpacked/templates" ]; then
            cp -a "$TMP_DIR/unpacked/templates/." "$TEMPLATE_DIR/"
          else
            echo "ERROR: Unexpected export template archive layout"
            find "$TMP_DIR/unpacked" -maxdepth 3 -type f | head -50
            exit 1
          fi

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"

          echo "Godot Android templates installed."

          rm -rf "$TMP_DIR"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Accepting Android SDK licenses..."

          mkdir -p "$ANDROID_HOME/licenses"

          set +o pipefail

          if yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /tmp/sdk-licenses.log 2>&1; then
            LICENSE_STATUS=0
          else
            LICENSE_STATUS=$?
          fi

          set -o pipefail

          echo "License command output:"
          tail -n 30 /tmp/sdk-licenses.log || true

          if [ "$LICENSE_STATUS" -ne 0 ]; then
            echo "ERROR: Android SDK license acceptance failed."
            exit 1
          fi

          echo "Android SDK licenses accepted."

          echo "Installing Android SDK components..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"

          echo "Checking Android SDK components..."

          test -x "$ANDROID_HOME/platform-tools/adb"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -d "$ANDROID_HOME/platforms/android-34"
          test -d "$ANDROID_HOME/cmdline-tools/latest"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"

          echo "Android SDK installation completed."

      - name: Prepare Android export settings
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          export/android/timestamping_authority_url = ""
          export/android/shutdown_adb_on_exit = true
          EOF

          echo "Checking Java..."

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/keytool"
          test -s "$HOME/.android/debug.keystore"

          java -version
          godot --version

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f main.tscn
          test -f main.gd
          test -f export_presets.cfg

          grep -q 'name="Android"' export_presets.cfg

          echo "Project files found."

      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euo pipefail

          godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --import

          godot --headless --editor \
            --path "$GITHUB_WORKSPACE" \
            --quit

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --quit-after 3

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless \
            --path "$GITHUB_WORKSPACE" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/PCWorkshop3D.apk" \
            --verbose

          test -s build/PCWorkshop3D.apk

          echo "APK successfully created:"
          ls -lh build/PCWorkshop3D.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PCWorkshop3D-Android-APK
          path: build/PCWorkshop3D.apk
          if-no-files-found: error
          retention-days: 14
          
