name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project folder
        shell: bash
        run: |
          PACKAGE_FILE=$(find . -type f -name package.json \
            -not -path '*/node_modules/*' \
            -not -path '*/.git/*' -print -quit)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found. Upload the extracted project files, not the ZIP archive."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          if [ ! -f "$PROJECT_DIR/angular.json" ]; then
            echo "ERROR: angular.json not found beside $PACKAGE_FILE. The complete project was not uploaded."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project folder: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Install Capacitor Android platform package
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install @capacitor/android@^7.4.4 --save

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build -- --configuration production

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pc-simulator-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
