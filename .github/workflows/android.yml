name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project folder
        shell: bash
        run: |
          LOCK_FILE=$(find . -type f -name package-lock.json -not -path '*/node_modules/*' -print -quit)
          if [ -z "$LOCK_FILE" ]; then
            echo "ERROR: package-lock.json was not found. Upload the complete project, including package.json and package-lock.json."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$LOCK_FILE")
          if [ ! -f "$PROJECT_DIR/package.json" ]; then
            echo "ERROR: package.json is missing beside $LOCK_FILE"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project folder: $PROJECT_DIR"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --prefix "$PROJECT_DIR"

      - name: Build web app
        run: npm run build --prefix "$PROJECT_DIR"

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pc-simulator-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
